<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Produtos</title>
    <link rel="stylesheet" href="css/style.css" />
</head>
<body>
    <nav>
        <a href="index.html">Home</a>
        <a href="produtos.html">Produtos</a>
        <a href="produto-form.html">Cadastrar</a>
    </nav>

    <div class="container">
        <h1>Produtos</h1>
        <div id="msg"></div>
        <div style="margin-bottom:20px;">
            <a href="produto-form.html" class="btn btn-success">+ Novo Produto</a>
        </div>
        <table>
            <thead>
                <tr>
                    <th>#</th>
                    <th>Nome</th>
                    <th>Preço</th>
                    <th>Qtd</th>
                    <th>Ações</th>
                </tr>
            </thead>
            <tbody id="tabela-body">
                <tr><td colspan="5">Carregando...</td></tr>
            </tbody>
        </table>
    </div>

    <script src="js/api.js"></script>
    <script>
        const corpo = document.getElementById("tabela-body");
        const msg   = document.getElementById("msg");

        async function carregar() {
            const produtos = await listarProdutos();
            if (!produtos.length) {
                corpo.innerHTML = '<tr><td colspan="5">Nenhum produto cadastrado.</td></tr>';
                return;
            }
            corpo.innerHTML = produtos.map(p => `
                <tr>
                    <td>${p.id}</td>
                    <td><a href="produto-detalhe.html?id=${p.id}">${p.nome}</a></td>
                    <td>R$ ${p.preco.toFixed(2)}</td>
                    <td>${p.quantidade}</td>
                    <td class="actions">
                        <a href="produto-form.html?id=${p.id}" class="btn btn-primary">Editar</a>
                        <button class="btn btn-danger" onclick="remover(${p.id})">Deletar</button>
                    </td>
                </tr>
            `).join("");
        }

        async function remover(id) {
            if (!confirm("Deseja deletar este produto?")) return;
            const res = await deletarProduto(id);
            if (res.mensagem) {
                msg.innerHTML = '<div class="msg msg-success">Produto deletado com sucesso.</div>';
                carregar();
            } else {
                msg.innerHTML = `<div class="msg msg-error">${res.erro}</div>`;
            }
        }

        carregar();
    </script>
</body>
</html>
